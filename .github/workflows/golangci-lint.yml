name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci-pr:
    name: lint-pr-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build module-pinned golangci-lint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/golangci-lint" github.com/golangci/golangci-lint/cmd/golangci-lint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: golangci-lint
        # Pinned to commit SHA for supply chain security (CWE-829)
        # Verify: gh api repos/golangci/golangci-lint-action/git/ref/tags/v9 --jq '.object.sha'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.0.0
        with:
          install-mode: none
          # The upstream cache key omits our module-selected analyzer versions.
          skip-cache: true
          only-new-issues: true
